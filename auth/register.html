<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow">
  <title>Create Account — Tradexa</title>
  <meta name="theme-color" content="#0d0f12">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"/>
  <script src="/assets/supabase-auth.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{background:#0d0f12;color:#e7e8ea;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}
    body{
      display:grid;place-items:center;padding:24px;position:relative;overflow-x:hidden;
      background:
        radial-gradient(900px 600px at 18% 14%, rgba(255,183,50,.12), transparent 60%),
        radial-gradient(900px 700px at 88% 86%, rgba(34,197,94,.07), transparent 60%),
        radial-gradient(700px 600px at 50% 110%, rgba(124,58,237,.07), transparent 60%),
        #0d0f12;
    }
    body::before{
      content:'';position:fixed;inset:0;pointer-events:none;
      background-image:linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                       linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size:42px 42px; mask-image:radial-gradient(900px 700px at 50% 40%, #000 40%, transparent 75%);
      -webkit-mask-image:radial-gradient(900px 700px at 50% 40%, #000 40%, transparent 75%);
    }
    .back{position:fixed;top:24px;left:24px;color:#9ca3af;text-decoration:none;font-size:13px;display:inline-flex;align-items:center;gap:6px;z-index:5}
    .back:hover{color:#FFB732}
    .glass{
      position:relative;width:100%;max-width:460px;
      background:linear-gradient(180deg, rgba(22,25,31,.72), rgba(15,17,22,.75));
      border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:40px 36px 34px;
      backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
      box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.02) inset,inset 0 1px 0 rgba(255,255,255,.05);
    }
    .glass::before{content:'';position:absolute;inset:-1px;border-radius:19px;pointer-events:none;
      background:linear-gradient(135deg, rgba(255,183,50,.35), transparent 32%, transparent 68%, rgba(255,183,50,.18));
      -webkit-mask:linear-gradient(#000,#000) content-box, linear-gradient(#000,#000);
      -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);mask-composite:exclude;padding:1px;opacity:.7}
    .logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:22px}
    .logo img{height:30px;width:auto}
    .logo-text{font-weight:700;letter-spacing:.04em;font-size:17px}
    h1{font-size:23px;font-weight:700;text-align:center;letter-spacing:-.01em;margin-bottom:6px}
    .sub{font-size:13.5px;color:#9ca3af;text-align:center;margin-bottom:22px}
    .oauth{display:grid;gap:9px;margin-bottom:18px}
    .oauth button{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
      background:rgba(255,255,255,.04);color:#e7e8ea;border:1px solid rgba(255,255,255,.09);
      border-radius:10px;font:600 13.5px 'Inter',sans-serif;padding:11px 14px;cursor:pointer;
      transition:transform .12s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease}
    .oauth button:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
    .oauth button.google{background:#fff;color:#1f2937;border-color:#fff}
    .oauth button.google:hover{background:#f3f4f6;border-color:#f3f4f6}
    .oauth svg{width:17px;height:17px;flex:0 0 17px}
    .or{display:flex;align-items:center;gap:12px;margin:18px 0 16px;color:#6b7280;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
    .or::before,.or::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.07)}
    label{display:block;font-size:11.5px;color:#9ca3af;margin-bottom:6px;font-weight:500;letter-spacing:.01em}
    .field{margin-bottom:13px}
    input{width:100%;background:rgba(13,15,18,.72);border:1px solid rgba(255,255,255,.09);border-radius:10px;
      color:#e7e8ea;font:14px 'Inter',sans-serif;padding:11px 13px;transition:border-color .15s ease, background .15s ease}
    input:focus{outline:none;border-color:#FFB732;background:rgba(13,15,18,.95);box-shadow:0 0 0 3px rgba(255,183,50,.12)}
    .submit{width:100%;background:#FFB732;color:#0d0f12;border:none;border-radius:10px;
      font:700 14px 'Inter',sans-serif;padding:12px 16px;cursor:pointer;margin-top:6px;
      transition:transform .12s ease, filter .12s ease, box-shadow .12s ease}
    .submit:hover{transform:translateY(-1px);filter:brightness(1.06);box-shadow:0 10px 28px rgba(255,183,50,.18)}
    .submit:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
    .err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.32);color:#fca5a5;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none}
    .err.show{display:block}
    .ok{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.32);color:#86efac;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none}
    .ok.show{display:block}
    .hint{font-size:11.5px;color:#6b7280;margin-top:-8px;margin-bottom:14px}
    .switch{text-align:center;margin-top:18px;color:#9ca3af;font-size:13px}
    .switch a{color:#FFB732;text-decoration:none;font-weight:600}
    .switch a:hover{text-decoration:underline}
    @media(max-width:480px){.glass{padding:30px 22px 26px}h1{font-size:20px}}
  </style>
</head>
<body>
  <a class="back" href="/">← Back to home</a>
  <div class="glass">
    <div class="logo">
      <img src="/assets/brand/tradexa-logo-icon.png" alt="Tradexa" onerror="this.style.display='none'"/>
      <div class="logo-text">TRADEXA</div>
    </div>
    <h1>Create your account</h1>
    <div class="sub">Free trial — no credit card required</div>

    <div class="err" id="err"></div>
    <div class="ok" id="ok"></div>

    <div class="oauth" id="oauthList"></div>

    <div class="or">or sign up with email</div>

    <form id="signupForm" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" autocomplete="name" placeholder="Alex Rivera"/>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="you@example.com"/>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="new-password" placeholder="At least 8 characters" minlength="8"/>
        <div class="hint">Minimum 8 characters.</div>
      </div>
      <button type="submit" class="submit" id="submitBtn">Create account</button>
    </form>

    <div class="switch">
      Already have an account? <a href="/auth/login.html">Sign in</a>
    </div>
  </div>

  <script>
    (function () {
      window.TxAuth.ready().then(function () {
        if (window.TxAuth.getSession())
          window.TxAuth.runLoginTransition({ user: window.TxAuth.getUser(), redirectTo: '/app/dashboard.html' });
      });

      var err = document.getElementById('err');
      var ok  = document.getElementById('ok');
      function showErr(msg){ err.textContent=msg; err.classList.add('show'); ok.classList.remove('show'); }
      function showOk(msg){  ok.textContent =msg; ok.classList.add('show');  err.classList.remove('show'); }

      var PROVIDER_DEFS = {
        google: { label:'Continue with Google', cls:'google',
          svg:'<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>',
          fn:'signInWithGoogle' },
        github: { label:'Continue with GitHub', cls:'',
          svg:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 .3a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.04c-3.34.72-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.21.09 1.84 1.24 1.84 1.24 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.31-5.47-1.34-5.47-5.95 0-1.32.47-2.39 1.24-3.23-.13-.31-.54-1.54.12-3.21 0 0 1.01-.32 3.31 1.23a11.5 11.5 0 0 1 6.02 0c2.3-1.55 3.31-1.23 3.31-1.23.66 1.67.25 2.9.12 3.21.77.84 1.24 1.91 1.24 3.23 0 4.62-2.81 5.63-5.49 5.93.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 12 .3"/></svg>',
          fn:'signInWithGitHub' },
        discord: { label:'Continue with Discord', cls:'',
          svg:'<svg viewBox="0 0 24 24" fill="#5865F2"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.07.07 0 0 0-.073.035 13.83 13.83 0 0 0-.61 1.25 18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.073.073 0 0 0-.073-.035A19.74 19.74 0 0 0 3.677 4.37a.064.064 0 0 0-.03.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.077.077 0 0 0 .084-.027 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.105 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.128 12.3 12.3 0 0 1-1.873.891.077.077 0 0 0-.041.106c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.03-.028zM8.02 15.331c-1.183 0-2.157-1.085-2.157-2.418 0-1.333.956-2.418 2.157-2.418 1.21 0 2.176 1.094 2.157 2.418 0 1.333-.956 2.418-2.157 2.418zm7.974 0c-1.183 0-2.157-1.085-2.157-2.418 0-1.333.955-2.418 2.157-2.418 1.21 0 2.176 1.094 2.157 2.418 0 1.333-.946 2.418-2.157 2.418z"/></svg>',
          fn:'signInWithDiscord' },
      };
      function renderProviders(){
        var list = document.getElementById('oauthList');
        var enabled = (window.TxAuth && window.TxAuth.PROVIDERS) || ['google'];
        list.innerHTML = '';
        enabled.forEach(function(key){
          var def = PROVIDER_DEFS[key]; if(!def) return;
          var b = document.createElement('button');
          b.type = 'button'; b.className = def.cls;
          b.innerHTML = def.svg + '<span>' + def.label + '</span>';
          b.addEventListener('click', function(){
            var label = key.charAt(0).toUpperCase()+key.slice(1);
            showOk('Redirecting to ' + label + '…');
            var watchdog = setTimeout(function(){
              if (ok.classList.contains('show')) {
                showErr(label + ' sign-in did not start. Make sure ' + label + ' is enabled in Supabase, then try again.');
              }
            }, 6000);
            window.TxAuth[def.fn]().then(function(res){
              if (res && res.error){ clearTimeout(watchdog); showErr(res.error.message || (label + ' sign-in failed')); }
            }).catch(function(e){
              clearTimeout(watchdog);
              showErr((e && e.message) || (label + ' sign-in failed'));
            });
          });
          list.appendChild(b);
        });
      }
      renderProviders();

      document.getElementById('signupForm').addEventListener('submit', function(e){
        e.preventDefault();
        var name  = document.getElementById('name').value.trim();
        var email = document.getElementById('email').value.trim();
        var pw    = document.getElementById('password').value;
        if(!email || !pw){ showErr('Email and password are required.'); return; }
        if(pw.length<8){ showErr('Password must be at least 8 characters.'); return; }
        var btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.textContent = 'Creating…';
        window.TxAuth.signUp(email, pw, { fullName: name }).then(function(res){
          if (res.error){
            showErr(res.error.message || 'Sign-up failed');
            btn.disabled=false; btn.textContent='Create account';
          } else if (res.data && res.data.session){
            window.TxAuth.runLoginTransition({ user: res.data.user, redirectTo: '/app/dashboard.html' });
          } else {
            showOk('Check your email to confirm your account, then sign in.');
            btn.disabled=false; btn.textContent='Create account';
          }
        }).catch(function(e){
          showErr(e.message || 'Sign-up failed');
          btn.disabled=false; btn.textContent='Create account';
        });
      });
    })();
  </script>
</body>
</html>
