<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow">
  <title>Signing you in… — Tradexa</title>
  <meta name="theme-color" content="#0d0f12">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"/>
  <script src="/assets/supabase-auth.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{background:#0d0f12;color:#e7e8ea;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}
    body{display:grid;place-items:center;padding:24px;text-align:center}
    .wrap{max-width:380px}
    .spinner{width:36px;height:36px;border:3px solid #22262e;border-top-color:#FFB732;border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    h1{font-size:18px;font-weight:600;margin-bottom:8px}
    .sub{color:#9ca3af;font-size:13.5px}
    .err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.32);color:#fca5a5;padding:12px 16px;border-radius:8px;font-size:13px;margin-top:18px;display:none}
    .err.show{display:block}
    a{color:#FFB732;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner" id="spin"></div>
    <h1 id="title">Finishing sign-in…</h1>
    <div class="sub" id="sub">Hold on — verifying your session.</div>
    <div class="err" id="err"></div>
  </div>
  <script>
    (function () {
      /* Supabase JS handles the OAuth code exchange automatically when
         detectSessionInUrl: true. We just wait for the session, then redirect. */
      var done = false;
      function go() {
        if (done) return;
        var sess = window.TxAuth.getSession();
        if (sess) {
          done = true;
          window.TxAuth.runLoginTransition({ user: window.TxAuth.getUser(), redirectTo: '/app/dashboard.html' });
        }
      }
      window.TxAuth.ready().then(function () {
        go();
        /* Fallback: also listen for auth-state-change in case the session
           lands a beat after ready() resolves (rare with PKCE). */
        document.addEventListener('tx-auth-change', go);
        setTimeout(function () {
          if (done) return;
          var sess = window.TxAuth.getSession();
          if (sess) { go(); return; }
          document.getElementById('spin').style.display = 'none';
          document.getElementById('title').textContent  = 'Sign-in did not complete';
          document.getElementById('sub').innerHTML =
            'Please <a href="/auth/login.html">try signing in again</a>.';
        }, 6000);
      }).catch(function (err) {
        document.getElementById('spin').style.display = 'none';
        document.getElementById('title').textContent  = 'Sign-in failed';
        var e = document.getElementById('err');
        e.textContent = (err && err.message) || 'Could not establish session.';
        e.classList.add('show');
        document.getElementById('sub').innerHTML =
          'Please <a href="/auth/login.html">try again</a>.';
      });
    })();
  </script>
</body>
</html>
