<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow">
  <title>Set New Password — Tradexa</title>
  <meta name="theme-color" content="#0d0f12">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"/>
  <script src="/assets/supabase-auth.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{background:#0d0f12;color:#e7e8ea;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}
    body{display:grid;place-items:center;padding:24px;
      background:radial-gradient(900px 600px at 18% 14%, rgba(255,183,50,.12), transparent 60%),
                 radial-gradient(900px 700px at 88% 86%, rgba(34,197,94,.07), transparent 60%),#0d0f12}
    .glass{position:relative;width:100%;max-width:420px;
      background:linear-gradient(180deg, rgba(22,25,31,.72), rgba(15,17,22,.75));
      border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:40px 36px 34px;
      backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
      box-shadow:0 30px 80px rgba(0,0,0,.5)}
    .logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:22px;font-weight:700;letter-spacing:.04em;font-size:17px}
    .logo img{height:30px;width:auto}
    h1{font-size:22px;font-weight:700;text-align:center;letter-spacing:-.01em;margin-bottom:6px}
    .sub{font-size:13.5px;color:#9ca3af;text-align:center;margin-bottom:22px}
    label{display:block;font-size:11.5px;color:#9ca3af;margin-bottom:6px;font-weight:500}
    input{width:100%;background:rgba(13,15,18,.72);border:1px solid rgba(255,255,255,.09);border-radius:10px;
      color:#e7e8ea;font:14px 'Inter',sans-serif;padding:11px 13px;margin-bottom:13px;transition:border-color .15s ease, background .15s ease}
    input:focus{outline:none;border-color:#FFB732;background:rgba(13,15,18,.95);box-shadow:0 0 0 3px rgba(255,183,50,.12)}
    .submit{width:100%;background:#FFB732;color:#0d0f12;border:none;border-radius:10px;
      font:700 14px 'Inter',sans-serif;padding:12px 16px;cursor:pointer;margin-top:6px;
      transition:transform .12s ease, filter .12s ease}
    .submit:hover{transform:translateY(-1px);filter:brightness(1.06)}
    .submit:disabled{opacity:.55;cursor:not-allowed;transform:none}
    .err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.32);color:#fca5a5;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none}
    .err.show{display:block}
    .ok{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.32);color:#86efac;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none}
    .ok.show{display:block}
    .hint{font-size:11.5px;color:#6b7280;margin-top:-8px;margin-bottom:14px}
    .switch{text-align:center;margin-top:18px;color:#9ca3af;font-size:13px}
    .switch a{color:#FFB732;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <div class="glass">
    <div class="logo">
      <img src="/assets/brand/tradexa-logo-icon.png" alt="Tradexa" onerror="this.style.display='none'"/>
      TRADEXA
    </div>
    <h1>Set a new password</h1>
    <div class="sub">Choose a strong password for your account.</div>

    <div class="err" id="err"></div>
    <div class="ok" id="ok"></div>

    <form id="resetForm" novalidate>
      <label for="pw">New password</label>
      <input type="password" id="pw" required autocomplete="new-password" placeholder="At least 8 characters" minlength="8"/>
      <label for="pw2">Confirm password</label>
      <input type="password" id="pw2" required autocomplete="new-password" placeholder="Re-enter password"/>
      <div class="hint">Minimum 8 characters.</div>
      <button type="submit" class="submit" id="btn">Update password</button>
    </form>

    <div class="switch"><a href="/auth/login.html">Back to sign in</a></div>
  </div>
  <script>
    (function(){
      var err=document.getElementById('err'), ok=document.getElementById('ok');
      function E(m){err.textContent=m;err.classList.add('show');ok.classList.remove('show');}
      function O(m){ok.textContent=m;ok.classList.add('show');err.classList.remove('show');}

      /* Supabase populates a recovery session from the link's URL hash automatically
         (detectSessionInUrl: true). We just wait for the session, then accept the
         password update against that session. */
      var sessionResolved = false;
      function onAuthChange(){
        if (window.TxAuth.getSession()){
          sessionResolved = true;
          document.removeEventListener('tx-auth-change', onAuthChange);
        }
      }
      window.TxAuth.ready().then(function(){
        if (window.TxAuth.getSession()){ sessionResolved = true; return; }
        document.addEventListener('tx-auth-change', onAuthChange);
        setTimeout(function(){
          if (!sessionResolved){
            document.removeEventListener('tx-auth-change', onAuthChange);
            E('Reset link is invalid or has expired. Request a new one from the sign-in page.');
          }
        }, 2000);
      }).catch(function(err){
        E((err && err.message) || 'Auth service unavailable. Try again in a moment.');
      });

      document.getElementById('resetForm').addEventListener('submit', function(e){
        e.preventDefault();
        var pw  = document.getElementById('pw').value;
        var pw2 = document.getElementById('pw2').value;
        if (pw.length < 8){ E('Password must be at least 8 characters.'); return; }
        if (pw !== pw2){ E('Passwords do not match.'); return; }
        if (!window.TxAuth.getSession()){ E('No active recovery session. Open the link from your email again.'); return; }
        var btn = document.getElementById('btn');
        btn.disabled = true; btn.textContent = 'Updating…';
        window.TxAuth.updatePassword(pw).then(function(res){
          if (res && res.error){
            E(res.error.message || 'Could not update password');
            btn.disabled = false; btn.textContent = 'Update password';
          } else {
            O('Password updated. Signing you in…');
            window.TxAuth.runLoginTransition({ user: window.TxAuth.getUser(), redirectTo: '/app/dashboard.html' });
          }
        }).catch(function(ex){
          E(ex.message || 'Could not update password');
          btn.disabled = false; btn.textContent = 'Update password';
        });
      });
    })();
  </script>
</body>
</html>
