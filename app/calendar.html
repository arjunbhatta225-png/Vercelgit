<body>
<script>document.addEventListener('DOMContentLoaded',function(){var t=document.getElementById('txPageTitle');if(t)t.textContent='Calendar'});</script>
<main class="tx-main">
  <div class="tx-page-header">
    <div>
      <h1 class="tx-page-title">Calendar</h1>
      <p class="tx-page-sub">Performance history by day. Click any day to see details.</p>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="tx-btn tx-btn-ghost tx-btn-sm" id="prevBtn">← Prev</button>
      <div style="font-size:15px;font-weight:700;color:var(--text);padding:0 8px;min-width:120px;text-align:center" id="monthLabel">—</div>
      <button class="tx-btn tx-btn-ghost tx-btn-sm" id="nextBtn">Next →</button>
    </div>
  </div>

  <!-- Summary Strip -->
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px" id="summaryStrip">
    <div class="tx-kpi"><div class="tx-kpi-label">Green Days</div><div class="tx-kpi-value" id="sum-green" style="color:var(--profit)">—</div><div class="tx-kpi-change" id="sum-green-sub">—</div></div>
    <div class="tx-kpi"><div class="tx-kpi-label">Red Days</div><div class="tx-kpi-value" id="sum-red" style="color:var(--loss)">—</div><div class="tx-kpi-change" id="sum-red-sub">—</div></div>
    <div class="tx-kpi"><div class="tx-kpi-label">Best Day</div><div class="tx-kpi-value" id="sum-best">—</div><div class="tx-kpi-change pos" id="sum-best-sub">—</div></div>
    <div class="tx-kpi"><div class="tx-kpi-label">Worst Day</div><div class="tx-kpi-value" id="sum-worst" style="color:var(--loss)">—</div><div class="tx-kpi-change neg" id="sum-worst-sub">—</div></div>
    <div class="tx-kpi"><div class="tx-kpi-label">Avg Daily P&amp;L</div><div class="tx-kpi-value" id="sum-avg">—</div><div class="tx-kpi-change" id="sum-avg-sub">—</div></div>
  </div>

  <div class="cal-wrap">
    <div>
      <!-- Day Headers -->
      <div class="cal-grid" style="margin-bottom:4px">
        <div class="cal-day-header">Mon</div>
        <div class="cal-day-header">Tue</div>
        <div class="cal-day-header">Wed</div>
        <div class="cal-day-header">Thu</div>
        <div class="cal-day-header">Fri</div>
        <div class="cal-day-header">Sat</div>
        <div class="cal-day-header">Sun</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>

      <!-- Legend -->
      <div style="display:flex;gap:16px;margin-top:12px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)"><div style="width:12px;height:12px;border-radius:2px;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3)"></div>Profit day</div>
        <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)"><div style="width:12px;height:12px;border-radius:2px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2)"></div>Loss day</div>
        <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)"><div style="width:12px;height:12px;border-radius:2px;background:var(--surface);border:1px solid var(--gold)"></div>Today</div>
        <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)"><div style="width:12px;height:12px;border-radius:2px;background:var(--surface);border:1px solid var(--dim)"></div>No trades</div>
      </div>
    </div>

    <!-- Day Detail Panel -->
    <div>
      <div style="font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px" id="detailLabel">Select a day</div>
      <div id="detailPanel">
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:24px;text-align:center">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--dim)" stroke-width="1.5" style="margin-bottom:10px"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <div style="color:var(--dim);font-size:13px">Click a day to view its trades</div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
(function(){
  var allTrades = [];
  var viewYear, viewMonth;
  var selectedDate = null;
  var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DOW_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  function fmt(v){ return (v>=0?'+':'')+'\$'+Math.abs(Math.round(v)).toLocaleString(); }
  function fmtAbs(v){ return '\$'+Math.abs(Math.round(v)).toLocaleString(); }
  /* Local-date YYYY-MM-DD — matches journal storage which is local-time, not UTC. */
  function _localDateStr(d){
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var dd = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + dd;
  }
  /* Parse YYYY-MM-DD as a LOCAL date. `new Date('YYYY-MM-DD')` parses as UTC,
     which then drifts a day for users west of UTC when read with local
     getDate()/getDay(). */
  function _parseLocalDate(s){
    var p = String(s||'').slice(0,10).split('-');
    return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  }
  /* HTML-escape user-controlled trade fields before injection via innerHTML. */
  function _calEsc(s){
    return String(s == null ? '' : s).replace(/[<>&"']/g, function(c){
      return ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  function el(id){ return document.getElementById(id); }

  function getDayMap(year, month){
    var ms = year+'-'+String(month+1).padStart(2,'0');
    var map = {};
    allTrades.filter(function(t){
      /* Type-guard t.date — non-string values would throw on startsWith/slice. */
      return typeof t.date === 'string' && t.date.startsWith(ms);
    }).forEach(function(t){
      var d = t.date.slice(0,10);
      if(!map[d]) map[d] = {pnl:0, count:0, trades:[]};
      /* Coerce — JSON storage may return pnl as string, which would concat under `+`. */
      var pnlNum = parseFloat(t.pnl);
      map[d].pnl += isFinite(pnlNum) ? pnlNum : 0;
      map[d].count++;
      map[d].trades.push(t);
    });
    return map;
  }

  function renderSummary(dayMap, year, month){
    var days = Object.values(dayMap);
    var greenDays = days.filter(function(d){ return d.pnl > 0; });
    var redDays = days.filter(function(d){ return d.pnl < 0; });
    var tradingDays = days.length;
    var bestDay = days.length ? days.reduce(function(a,b){ return a.pnl > b.pnl ? a : b; }, days[0]) : null;
    var worstDay = days.length ? days.reduce(function(a,b){ return a.pnl < b.pnl ? a : b; }, days[0]) : null;
    var totalPnl = days.reduce(function(s,d){ return s+d.pnl; }, 0);
    var avgPnl = tradingDays ? totalPnl / tradingDays : 0;

    var bestEntry = bestDay ? Object.entries(dayMap).find(function(e){ return e[1]===bestDay; }) : null;
    var worstEntry = worstDay ? Object.entries(dayMap).find(function(e){ return e[1]===worstDay; }) : null;

    el('sum-green').textContent = greenDays.length;
    el('sum-green-sub').textContent = tradingDays ? 'of '+tradingDays+' trading days' : 'No trades this month';
    el('sum-green-sub').className = 'tx-kpi-change pos';

    el('sum-red').textContent = redDays.length;
    el('sum-red-sub').textContent = tradingDays ? Math.round(redDays.length/tradingDays*100)+'% of days' : '—';
    el('sum-red-sub').className = 'tx-kpi-change neg';

    if(bestEntry && bestDay.pnl > 0){
      el('sum-best').textContent = fmt(bestDay.pnl);
      el('sum-best').style.color = 'var(--profit)';
      var bd = _parseLocalDate(bestEntry[0]);
      el('sum-best-sub').textContent = bd.getDate()+' '+MONTH_NAMES[bd.getMonth()].slice(0,3)+', '+DOW_NAMES[bd.getDay()];
    } else {
      el('sum-best').textContent = '—';
      el('sum-best').style.color = 'var(--text)';
      el('sum-best-sub').textContent = 'No profitable days';
    }

    if(worstEntry && worstDay.pnl < 0){
      el('sum-worst').textContent = fmt(worstDay.pnl);
      var wd = _parseLocalDate(worstEntry[0]);
      el('sum-worst-sub').textContent = wd.getDate()+' '+MONTH_NAMES[wd.getMonth()].slice(0,3)+', '+DOW_NAMES[wd.getDay()];
    } else {
      el('sum-worst').textContent = '—';
      el('sum-worst-sub').textContent = 'No losing days';
    }

    var avgColor = avgPnl >= 0 ? 'var(--profit)' : 'var(--loss)';
    el('sum-avg').textContent = tradingDays ? fmt(avgPnl) : '—';
    el('sum-avg').style.color = tradingDays ? avgColor : 'var(--text)';
    el('sum-avg-sub').textContent = MONTH_NAMES[month].slice(0,3)+' '+year;
    el('sum-avg-sub').className = 'tx-kpi-change '+(avgPnl>=0?'pos':'neg');
  }

  function renderCalendar(year, month){
    viewYear = year; viewMonth = month;
    el('monthLabel').textContent = MONTH_NAMES[month]+' '+year;

    var dayMap = getDayMap(year, month);
    renderSummary(dayMap, year, month);

    var daysInMonth = new Date(year, month+1, 0).getDate();
    var firstDow = new Date(year, month, 1).getDay();
    var offset = (firstDow + 6) % 7;
    var prevDays = new Date(year, month, 0).getDate();
    /* Use local date string — calendar dateStr keys are local-formatted, so UTC
       comparison would mis-flag "today" by a day for users east of UTC after
       local midnight. */
    var todayStr = _localDateStr(new Date());
    var now = new Date();

    var html = '';

    for(var i=offset-1; i>=0; i--){
      html += '<div class="cal-cell other-month"><div class="cal-date">'+(prevDays-i)+'</div></div>';
    }

    for(var d=1; d<=daysInMonth; d++){
      var dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      var data = dayMap[dateStr];
      var isFuture = new Date(year, month, d) > now;
      var isToday = dateStr === todayStr;
      var isSelected = dateStr === selectedDate;

      var classes = 'cal-cell';
      if(isFuture) classes += ' future';
      if(isToday) classes += ' today';
      if(isSelected) classes += ' selected';
      if(data && data.pnl > 0) classes += ' profit';
      if(data && data.pnl < 0) classes += ' loss';

      var inner = '<div class="cal-date"'+(isToday?' style="color:var(--gold)"':'')+'>'+d+(isToday?' ●':'')+'</div>';
      if(data){
        var pnlColor = data.pnl >= 0 ? 'var(--profit)' : 'var(--loss)';
        inner += '<div class="cal-pnl" style="color:'+pnlColor+'">'+fmt(data.pnl)+'</div>';
        inner += '<div class="cal-trades">'+data.count+' trade'+(data.count!==1?'s':'')+'</div>';
        inner += '<div class="cal-dot-row">';
        data.trades.slice(0,5).forEach(function(t){
          inner += '<div class="cal-dot" style="background:'+((parseFloat(t.pnl)||0)>=0?'var(--profit)':'var(--loss)')+'"></div>';
        });
        inner += '</div>';
      } else if(!isFuture){
        inner += '<div class="cal-trades" style="color:var(--dim);font-size:10px;margin-top:4px">No trades</div>';
      }

      html += '<div class="'+classes+'" onclick="selectDay(\''+dateStr+'\')">'+inner+'</div>';
    }

    var totalCells = offset + daysInMonth;
    var remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
    for(var i=1; i<=remaining; i++){
      html += '<div class="cal-cell other-month"><div class="cal-date">'+i+'</div></div>';
    }

    el('calGrid').innerHTML = html;

    if(!selectedDate){
      var todayData = dayMap[todayStr];
      if(todayData){ window.selectDay(todayStr); }
    }
  }

  window.selectDay = function(dateStr){
    selectedDate = dateStr;
    var year = parseInt(dateStr.slice(0,4));
    var month = parseInt(dateStr.slice(5,7))-1;
    var day = parseInt(dateStr.slice(8,10));

    var calCells = el('calGrid').querySelectorAll('.cal-cell');
    calCells.forEach(function(c){ c.classList.remove('selected'); });
    calCells.forEach(function(c){
      if(c.querySelector('.cal-date') && !c.classList.contains('other-month')){
        var txt = c.querySelector('.cal-date').textContent.replace('●','').trim();
        if(parseInt(txt) === day) c.classList.add('selected');
      }
    });

    var dayMap = getDayMap(year, month);
    var data = dayMap[dateStr];
    var dateLabel = day+' '+MONTH_NAMES[month]+' '+year;
    var isToday = dateStr === _localDateStr(new Date());
    el('detailLabel').textContent = dateLabel + (isToday ? ' — Today' : '');

    if(!data){
      el('detailPanel').innerHTML =
        '<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:24px;text-align:center">'+
          '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--dim)" stroke-width="1.5" style="margin-bottom:10px"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'+
          '<div style="color:var(--dim);font-size:13px">No trades on this day</div>'+
        '</div>';
      return;
    }

    var wins = data.trades.filter(function(t){ return (parseFloat(t.pnl)||0) > 0; }).length;
    var wr = data.trades.length ? Math.round(wins/data.trades.length*100) : 0;
    /* Coerce rr to number before filtering/reducing — strings would concat. */
    var rrNums = data.trades.map(function(t){ return parseFloat(t.rr); }).filter(function(v){ return isFinite(v) && v > 0; });
    var avgRRval = rrNums.length ? Math.round(rrNums.reduce(function(s,v){ return s+v; },0)/rrNums.length*10)/10 : 0;
    var pnlColor = data.pnl >= 0 ? 'var(--profit)' : 'var(--loss)';

    var tradesHtml = data.trades.map(function(t){
      var pnlNum = parseFloat(t.pnl) || 0;
      var tc = pnlNum >= 0 ? 'var(--profit)' : 'var(--loss)';
      var time = (typeof t.date === 'string' ? t.date.slice(11,16) : '') || '—';
      var setup = (Array.isArray(t.setup) ? t.setup.join('/') : (typeof t.setup === 'string' ? t.setup : '')) || '—';
      var emot  = (Array.isArray(t.emotion) ? t.emotion.join('/') : (typeof t.emotion === 'string' ? t.emotion : '')) || '—';
      var dirRaw = typeof t.direction === 'string' ? t.direction : '';
      var dirLabel = dirRaw ? (dirRaw.charAt(0).toUpperCase() + dirRaw.slice(1).toLowerCase()) : '';
      var rrNum = parseFloat(t.rr);
      var rrTxt = isFinite(rrNum) ? rrNum.toFixed(1) : '—';
      var noteRaw = typeof t.notes === 'string' ? t.notes : '';
      var noteTrunc = noteRaw.slice(0,100) + (noteRaw.length > 100 ? '…' : '');
      return '<div class="detail-trade">'+
        '<div style="display:flex;justify-content:space-between;align-items:center">'+
          '<strong style="font-size:12px;color:var(--text)">'+_calEsc(t.asset || '—')+' '+_calEsc(dirLabel)+'</strong>'+
          '<span style="font-size:12px;font-weight:700;color:'+tc+'">'+(pnlNum>=0?'+':'')+'\$'+_calEsc(Math.abs(pnlNum).toLocaleString())+'</span>'+
        '</div>'+
        '<div style="font-size:11px;color:var(--dim);margin-top:3px">'+_calEsc(time)+' · '+_calEsc(setup)+' · '+_calEsc(emot)+' · R:R '+_calEsc(rrTxt)+'</div>'+
        (noteRaw ? '<div style="font-size:11px;color:var(--dim);margin-top:4px;line-height:1.5;border-top:1px solid var(--border);padding-top:4px">"'+_calEsc(noteTrunc)+'"</div>' : '')+
      '</div>';
    }).join('<div style="margin:4px 0"></div>');

    el('detailPanel').innerHTML =
      '<div class="day-detail">'+
        '<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px">'+
          '<div style="font-size:22px;font-weight:800;color:'+pnlColor+';margin-bottom:8px;letter-spacing:-.03em">'+fmt(data.pnl)+'</div>'+
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
            '<div style="background:var(--bg);padding:8px;border-radius:6px;text-align:center"><div style="font-size:15px;font-weight:700;color:var(--text)">'+data.count+'</div><div style="font-size:10px;color:var(--dim)">Trades</div></div>'+
            '<div style="background:var(--bg);padding:8px;border-radius:6px;text-align:center"><div style="font-size:15px;font-weight:700;color:'+(wr>=60?'var(--profit)':wr>=50?'var(--blue)':'var(--loss)')+'">'+wr+'%</div><div style="font-size:10px;color:var(--dim)">Win Rate</div></div>'+
            '<div style="background:var(--bg);padding:8px;border-radius:6px;text-align:center"><div style="font-size:15px;font-weight:700;color:var(--text)">'+avgRRval+'</div><div style="font-size:10px;color:var(--dim)">Avg R:R</div></div>'+
            '<div style="background:var(--bg);padding:8px;border-radius:6px;text-align:center"><div style="font-size:15px;font-weight:700;color:var(--text)">'+wins+'/'+data.count+'</div><div style="font-size:10px;color:var(--dim)">W/L</div></div>'+
          '</div>'+
        '</div>'+
        '<div>'+
          '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin-bottom:8px">Trades This Day</div>'+
          tradesHtml+
        '</div>'+
        '<a href="/app/journal.html" class="tx-btn tx-btn-ghost" style="width:100%;justify-content:center">View Full Journal →</a>'+
      '</div>';
  };

  function init(){
    if(typeof TxTradeData === 'undefined'){ setTimeout(init, 80); return; }
    allTrades = TxTradeData.getTrades();
    var now = new Date();
    viewYear = now.getFullYear();
    viewMonth = now.getMonth();

    renderCalendar(viewYear, viewMonth);

    el('prevBtn').addEventListener('click', function(){
      viewMonth--;
      if(viewMonth < 0){ viewMonth = 11; viewYear--; }
      selectedDate = null;
      renderCalendar(viewYear, viewMonth);
    });
    el('nextBtn').addEventListener('click', function(){
      viewMonth++;
      if(viewMonth > 11){ viewMonth = 0; viewYear++; }
      selectedDate = null;
      renderCalendar(viewYear, viewMonth);
    });
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
<script src="/assets/tradebot.js" defer></script>
</body>
</html>
